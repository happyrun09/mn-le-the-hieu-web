<!-- KHUNG ẢNH HERO CHUẨN 16:10 (Kích thước khuyến nghị khi thay ảnh thật của trường: 1280x800px, định dạng JPG/WebP) -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-label="Minh họa Trường Mầm non Lê Thế Hiếu - Ươm mầm xanh trên quê hương vùng Cùa">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EBF7F1"/>
      <stop offset="65%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="hill1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#289668"/>
      <stop offset="100%" stop-color="#1B7350"/>
    </linearGradient>
    <linearGradient id="hill2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#289668"/>
    </linearGradient>
  </defs>
  <rect width="800" height="500" rx="24" fill="url(#sky)"/>
  <!-- Ông mặt trời & Mây -->
  <circle cx="670" cy="105" r="52" fill="#F59E0B" opacity="0.9"/>
  <circle cx="670" cy="105" r="68" fill="#FBBF24" opacity="0.25"/>
  <g fill="#FFFFFF" opacity="0.92">
    <rect x="80" y="75" width="130" height="38" rx="19"/>
    <circle cx="115" cy="75" r="24"/>
    <circle cx="155" cy="70" r="28"/>
    <rect x="440" y="55" width="110" height="32" rx="16"/>
    <circle cx="475" cy="55" r="20"/>
    <circle cx="510" cy="52" r="22"/>
  </g>
  <!-- Đồi xanh vùng Cùa Cam Lộ -->
  <path d="M0 370 Q220 290 460 355 T800 330 L800 500 L0 500 Z" fill="url(#hill2)" opacity="0.75"/>
  <path d="M0 405 Q280 340 550 390 T800 375 L800 500 L0 500 Z" fill="url(#hill1)"/>
  <!-- Ngôi trường Mầm non Lê Thế Hiếu thân thiện -->
  <g transform="translate(175, 165)">
    <!-- Khối nhà chính -->
    <rect x="40" y="75" width="370" height="150" rx="12" fill="#FFFDF9" stroke="#1B7350" stroke-width="4"/>
    <!-- Mái ngói đỏ tươi -->
    <polygon points="15,78 225,5 435,78" fill="#EF4444" stroke="#B91C1C" stroke-width="4" stroke-linejoin="round"/>
    <!-- Đồng hồ / Huy hiệu mái trường -->
    <circle cx="225" cy="48" r="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="4"/>
    <path d="M225 38 L225 48 L232 48" stroke="#1B7350" stroke-width="3" stroke-linecap="round"/>
    <!-- Biển tên trường -->
    <rect x="95" y="88" width="260" height="30" rx="6" fill="#1B7350"/>
    <text x="225" y="108" font-family="sans-serif" font-size="13" font-weight="700" fill="#FFFBEB" text-anchor="middle">TRƯỜNG MẦM NON LÊ THẾ HIẾU</text>
    <!-- Cửa chính & Cửa sổ lớp học -->
    <rect x="190" y="145" width="70" height="80" rx="10" fill="#F59E0B"/>
    <rect x="200" y="155" width="22" height="68" rx="4" fill="#FFFBEB"/>
    <rect x="228" y="155" width="22" height="68" rx="4" fill="#FFFBEB"/>
    <!-- Cửa sổ trái -->
    <rect x="70" y="135" width="48" height="48" rx="8" fill="#A7F3D0" stroke="#1B7350" stroke-width="3"/>
    <rect x="130" y="135" width="48" height="48" rx="8" fill="#A7F3D0" stroke="#1B7350" stroke-width="3"/>
    <!-- Cửa sổ phải -->
    <rect x="275" y="135" width="48" height="48" rx="8" fill="#A7F3D0" stroke="#1B7350" stroke-width="3"/>
    <rect x="335" y="135" width="48" height="48" rx="8" fill="#A7F3D0" stroke="#1B7350" stroke-width="3"/>
  </g>
  <!-- Cây xanh & Hoa sân trường -->
  <g transform="translate(85, 250)">
    <rect x="28" y="80" width="16" height="55" rx="4" fill="#92400E"/>
    <circle cx="36" cy="55" r="42" fill="#289668"/>
    <circle cx="18" cy="70" r="28" fill="#34D399"/>
    <circle cx="54" cy="70" r="28" fill="#1B7350"/>
  </g>
  <g transform="translate(625, 240)">
    <rect x="28" y="85" width="16" height="60" rx="4" fill="#92400E"/>
    <circle cx="36" cy="58" r="44" fill="#289668"/>
    <circle cx="16" cy="72" r="30" fill="#34D399"/>
    <circle cx="56" cy="72" r="30" fill="#1B7350"/>
  </g>
  <!-- Nhãn chú thích thay ảnh thật -->
  <rect x="180" y="438" width="440" height="36" rx="18" fill="#1C2621" opacity="0.78"/>
  <text x="400" y="461" font-family="sans-serif" font-size="13" font-weight="600" fill="#FFFBEB" text-anchor="middle">✨ Khung ảnh 16:10 (1280×800px) • Sẵn sàng thay ảnh thực tế nhà trường</text>
</svg>
